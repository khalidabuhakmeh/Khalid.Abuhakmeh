name: Release

# The ONLY publishing workflow. NuGet trusted publishing policies are bound to this exact file name
# (release.yml), so everything (index refresh, version, commit, tag, pack, push, GitHub release)
# happens in this one workflow instead of reusable/called workflows (which change the OIDC claims).
#
# Triggers
#   schedule          weekly. The blog publishes on Tuesdays and Fridays; Monday 13:00 UTC picks up a full
#                     week of posts before the week starts. Skips itself when no posts changed.
#   workflow_dispatch manual run; tick "force" to release even if the post index did not change, and to
#                     accept an unusually large index change (see scripts/update-posts-index.mjs).
#   push tag          manual release of a hand-made DATE tag (v2026.11.19 or v2026.11.19.1). Only commits that are
#                     already on the default branch may be published. The version comes from the tag, the index
#                     is NOT refreshed and nothing is committed or tagged.
on:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: Release even if no posts changed (also accepts a large index change)
        type: boolean
        default: false
  push:
    tags:
      - 'v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]'
      - 'v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].*'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the index commit + tag, create the GitHub release
      id-token: write   # NuGet trusted publishing (OIDC)
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
      FORCE: ${{ inputs.force == true }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tags are needed to pick the next version, history for the ancestor check
          ref: ${{ github.event_name == 'push' && github.ref || github.event.repository.default_branch }}

      # Tag runs publish to NuGet, so the tagged commit must already be on the default branch. This stops a
      # tag on an unreviewed branch or fork-style commit from publishing.
      - name: Verify tag is on the default branch
        if: env.IS_TAG == 'true'
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Tagged commit $GITHUB_SHA is not an ancestor of origin/$DEFAULT_BRANCH; refusing to publish."
            exit 1
          fi

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # --- Gate: refresh the index from https://khalidabuhakmeh.com/llms.txt and decide whether to release ---
      - name: Refresh post index
        id: index
        if: env.IS_TAG != 'true'
        env:
          NOTES_FILE: ${{ runner.temp }}/notes.md
        run: |
          extra=()
          if [ "$FORCE" = "true" ]; then extra+=(--allow-large-change); fi
          node scripts/update-posts-index.mjs --notes-out "$NOTES_FILE" "${extra[@]}"

      - name: Decide
        id: gate
        env:
          INDEX_CHANGED: ${{ steps.index.outputs.changed }}
        run: |
          if [ "$IS_TAG" = "true" ] || [ "$INDEX_CHANGED" = "true" ] || [ "$FORCE" = "true" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No new posts, skipping release."
          fi

      - name: Compute version
        id: version
        if: steps.gate.outputs.release == 'true'
        run: |
          if [ "$IS_TAG" = "true" ]; then
            node scripts/compute-version.mjs --from-tag "$GITHUB_REF_NAME"
          else
            node scripts/compute-version.mjs
          fi

      # --- Build, test, pack ---
      - name: Build
        if: steps.gate.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet build -c Release -p:Version="$VERSION"

      - name: Test
        if: steps.gate.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet test -c Release --no-build -p:Version="$VERSION"

      - name: Pack
        if: steps.gate.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet pack src/Khalid.Abuhakmeh -c Release --no-build -p:Version="$VERSION" -o artifacts

      - name: Validate package contents
        if: steps.gate.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          pkg="artifacts/Khalid.Abuhakmeh.${VERSION}.nupkg"
          listing=$(unzip -l "$pkg")
          for expected in skills/local-khalid/SKILL.md skills/local-khalid/references/posts.md skills/local-khalid/references/about.md lib/netstandard2.0/Khalid.Abuhakmeh.dll lib/net8.0/Khalid.Abuhakmeh.dll README.md icon.png; do
            grep -q " $expected\$" <<<"$listing" || { echo "::error::Missing $expected in $pkg"; exit 1; }
          done
          echo "$listing"

      # --- Commit the refreshed index and tag it (scheduled/manual runs only). Done after tests pass so a
      #     broken build never leaves a stray tag. Tags pushed with GITHUB_TOKEN do not start other workflows.
      - name: Commit index and tag
        if: steps.gate.outputs.release == 'true' && env.IS_TAG != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/local-khalid/references/posts.md
          if ! git diff --cached --quiet; then
            git commit -m "Refresh post index ($(date -u +%F))"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
          git tag "$TAG"
          git push origin "$TAG"

      # --- Publish ---
      # Trusted publishing: add a policy on nuget.org for this repo + workflow file release.yml and set the
      # repository variable NUGET_USER to your nuget.org profile name.
      # Fallback without OIDC: drop this step and use --api-key "$NUGET_API_KEY" (from secrets.NUGET_API_KEY) below.
      - name: NuGet login (OIDC)
        id: login
        if: steps.gate.outputs.release == 'true'
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        if: steps.gate.outputs.release == 'true'
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate

      - name: GitHub release
        if: steps.gate.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTES_FILE: ${{ runner.temp }}/notes.md
        run: |
          if [ -s "$NOTES_FILE" ]; then
            gh release create "$TAG" artifacts/*.nupkg artifacts/*.snupkg --title "$TAG" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" artifacts/*.nupkg artifacts/*.snupkg --title "$TAG" --generate-notes
          fi
