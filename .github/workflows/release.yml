name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # NuGet trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore -p:Version=${VERSION}
      - run: dotnet test -c Release --no-build
      - run: dotnet pack src/Khalid.Abuhakmeh -c Release --no-build -p:Version=${VERSION} -o artifacts
      - name: Validate skills are in the package
        run: unzip -l artifacts/Khalid.Abuhakmeh.${VERSION}.nupkg | grep -q " skills/local-khalid/SKILL.md$"

      # Trusted publishing: configure the policy on nuget.org (Trusted Publishing),
      # set repo variable NUGET_USER to your nuget.org profile name.
      # Fallback: skip this step and pass --api-key ${{ secrets.NUGET_API_KEY }} below.
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/*nupkg
